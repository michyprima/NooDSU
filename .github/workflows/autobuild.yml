name: Automatic Builds

on:
  push:
    branches:
    - master

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Compile
      run: make -j$(nproc)
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: noodsu-wiiu
        path: noodsu.wuhb
